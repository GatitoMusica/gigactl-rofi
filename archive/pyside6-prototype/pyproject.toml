
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigactl-control"
version = "0.1.0"
description = "A KDE system tray control panel for Gigabyte laptop fans and RGB keyboard."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7"
]

[project.scripts]
gigactl-control = "gigactl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gigactl = [
    "themes/*.qss",
    "assets/*.svg"
]
