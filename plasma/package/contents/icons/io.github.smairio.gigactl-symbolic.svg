    <path d="M24 15.2c-2.6-2.9-3.5-5.3-1.6-8.1 3.2 1 4.8 3.9 3.1 8.2z"
          transform="rotate(240 24 17)"/>
  </g>
  <circle class="ColorScheme-Highlight" cx="24" cy="17" r="2.1" fill="currentColor"/>

  <!-- RGB keyboard -->
  <rect class="ColorScheme-Text" x="5.5" y="31" width="37" height="12" rx="2"
        fill="none" stroke="currentColor" stroke-width="2"/>
  <g>
    <rect class="ColorScheme-Highlight" x="9" y="34" width="4" height="2" rx="0.6" fill="currentColor"/>
