    <rect class="ColorScheme-Highlight" x="21" y="34" width="4" height="2" rx="0.6" fill="currentColor"/>
    <rect class="ColorScheme-Text" x="27" y="34" width="4" height="2" rx="0.6" fill="currentColor"/>
    <rect class="ColorScheme-Highlight" x="33" y="34" width="5" height="2" rx="0.6" fill="currentColor"/>
    <rect class="ColorScheme-Text" x="9" y="38" width="4" height="2" rx="0.6" fill="currentColor"/>
    <rect class="ColorScheme-Text" x="15" y="38" width="16" height="2" rx="0.6" fill="currentColor"/>
    <rect class="ColorScheme-Text" x="33" y="38" width="5" height="2" rx="0.6" fill="currentColor"/>
  </g>
